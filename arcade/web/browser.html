<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browser</title>
<!-- Browser 1.2: every name's site, on every chain the arcade reads (served at /browser and inscribed as the App Store's
     Browser card; the T-Deck's Browser reads .mesh sites only). -->
<style>
:root { --bg:#141310; --fg:#ece8e0; --muted:#9b948a; --line:#2c2a25; --accent:#d9a520; --panel:#1c1b17; --link:#6fb0ff; }
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; display:flex; flex-direction:column; }
.bar { display:flex; gap:6px; align-items:center; padding:8px; background:var(--panel); border-bottom:1px solid var(--line); }
.bar button { flex:none; width:34px; height:34px; display:grid; place-items:center; border:1px solid var(--line); background:transparent;
  color:var(--accent); border-radius:999px; cursor:pointer; padding:0; }
.bar button:disabled { opacity:.35; cursor:default; }
.bar button svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.bar input { flex:1; min-width:0; height:34px; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:999px;
  padding:0 14px; font:14px system-ui; }
#view { flex:1; min-height:0; overflow:auto; }
main { max-width:680px; margin:0 auto; padding:12px 16px 40px; }
iframe { display:block; width:100%; height:100%; border:0; background:#fff; }
h1 { color:var(--accent); font-size:1.4rem; margin:.4em 0 .3em; } h2 { font-size:1.15rem; margin:.8em 0 .2em; } h3 { font-size:1rem; margin:.7em 0 .2em; }
p { margin:.2em 0; } a { color:var(--link); cursor:pointer; } blockquote { margin:.3em 0; padding-left:10px; border-left:3px solid var(--line); color:var(--muted); }
pre { font:13px/1.25 ui-monospace, monospace; overflow:auto; }
.pic img { display:block; max-width:100%; image-rendering:pixelated; border-radius:4px; }
.pic span { color:var(--muted); font-size:12px; }
.chain { color:var(--muted); font-size:12px; }
.status { flex:none; padding:3px 12px; border-top:1px solid var(--line); color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
</style>
</head>
<body>
<div class="bar">
  <button id="back" title="Back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button id="fwd" title="Forward" aria-label="Forward"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  <button id="reload" title="Refresh" aria-label="Refresh"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg></button>
  <button id="home" title="Home (hold or right-click to make this page home)" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 10v10h12V10"/></svg></button>
  <input id="addr" autocomplete="off" spellcheck="false" placeholder="name.mesh, name.pepe, doge:name.doge/page" aria-label="Address">
  <button id="go" title="Go" aria-label="Go"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
</div>
<div id="view"></div>
<div class="status" id="status"></div>
<script>
// The Browser (docs/mesh-web.md): every p:dns name's site, from this arcade's /r/site. A name's site is the newest
// record its holder inscribed; a page is MeshText (drawn here, pictures and all), HTML or another inscription (shown in
// a sandboxed frame, as inscriptions always are). Root-relative URLs: the same file works at /browser and as a card.
var back = [], fwd = [], at = null;
var $ = function (id) { return document.getElementById(id); };
var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]; }); };
var store = function (k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };
var home = function () { return store("browserhome") || "directory"; };
var atBrowser = location.pathname.indexOf("/browser") === 0;
function siteOf(a) { var s = String(a || ""), c = s.match(/^([a-z0-9-]+):(?!\/)/); if (c) s = s.slice(c[0].length); return {chain: c ? c[1] : "", name: s.split("/")[0], rest: s}; }
function resolve(t) {
  t = t.replace(/^mesh:\/\//, "");
  if (t.charAt(0) !== "/") return t;
  var here = siteOf(at || ""); return (here.chain ? here.chain + ":" : "") + here.name + (t === "/" ? "" : t);
}
var PIC = /^!\[([^\]]*)\]\(\s*([0-9a-fA-F]{64}[iI]\d{1,6})\s*\)\s*$/;
function meshtext(text) {
  var out = [], pre = false;
  String(text).split("\n").forEach(function (line) {
    if (line.indexOf("```") === 0) { out.push(pre ? "</pre>" : "<pre>"); pre = !pre; return; }
    if (pre) { out.push(esc(line)); return; }
    var s = line.replace(/\s+$/, ""), m = s.trim().match(PIC);
    if (m) out.push('<p class="pic"><img src="/content/' + esc(m[2].toLowerCase()) + '" alt="' + esc(m[1]) + '">' + (m[1] ? "<span>" + esc(m[1]) + "</span>" : "") + "</p>");
    else if (s.indexOf("=>") === 0) { var p = s.slice(2).trim().split(/\s+/), t = p.shift(); if (t) out.push('<p><a data-to="' + esc(resolve(t)) + '">' + esc(p.join(" ") || t) + "</a></p>"); }
    else if (s.indexOf("### ") === 0) out.push("<h3>" + esc(s.slice(4)) + "</h3>");
    else if (s.indexOf("## ") === 0) out.push("<h2>" + esc(s.slice(3)) + "</h2>");
    else if (s.indexOf("# ") === 0) out.push("<h1>" + esc(s.slice(2)) + "</h1>");
    else if (s.indexOf("* ") === 0) out.push("<p>&bull; " + esc(s.slice(2)) + "</p>");
    else if (s.charAt(0) === ">") out.push("<blockquote>" + esc(s.slice(1).trim()) + "</blockquote>");
    else if (s) out.push("<p>" + esc(s) + "</p>");
  });
  if (pre) out.push("</pre>");
  return "<main>" + out.join("") + "</main>";
}
function show(html, status, title) {
  $("view").innerHTML = html; $("view").scrollTop = 0;
  $("status").textContent = status; document.title = (title ? title + " · " : "") + "Browser";
  $("back").disabled = !back.length; $("fwd").disabled = !fwd.length;
}
function directory() {
  return fetch("/r/sites").then(function (r) { return r.json(); }).then(function (d) {
    var names = d.names || [], lines = ["# The Browser", "Every name with a site, newest first. Type any name above: .mesh, .pepe, .doge, ...", ""];
    names.forEach(function (n) { lines.push("=> " + n.chain + ":" + n.name + " " + n.name + (n.title ? " - " + n.title : "") + "  (" + n.chain + ")"); });
    if (!names.length) lines.push("Nobody has published a site yet. Claim a name and publish one from the arcade's Creator tab.");
    show(meshtext(lines.join("\n")), "Document: Done (" + names.length + " sites)", "");
  });
}
function go(address, how) {
  address = String(address || "").trim().replace(/^mesh:\/\//, "").replace(/\/+$/, "");
  if (!address) return;
  if (how !== "back" && how !== "fwd" && how !== "reload") { if (at && at !== address) back.push(at); fwd = []; }
  at = address; $("addr").value = address === "directory" ? "" : address;
  if (atBrowser && how !== "start") try { history.replaceState(null, "", "/browser/" + (address === "directory" ? "" : address)); } catch (e) {}
  $("status").textContent = "Contacting " + address + "…";
  if (address === "directory") { directory().catch(function () { show(meshtext("# Not found\nThis arcade did not answer."), "Document: not found"); }); return; }
  var s = siteOf(address);
  fetch("/r/site/" + s.rest + (s.chain ? "?chain=" + encodeURIComponent(s.chain) : "")).then(function (r) { return r.json(); }).then(function (p) {
    if (p.choices) {
      show(meshtext("# " + p.name + "\nThis name has a site on more than one chain:\n\n" + p.choices.map(function (c) { return "=> " + c.chain + ":" + p.name + (s.rest.indexOf("/") > 0 ? s.rest.slice(s.rest.indexOf("/")) : "") + " On " + c.chain; }).join("\n")), "Document: choose a chain", p.name);
    } else if (p.kind === "text") {
      show(meshtext(p.body), "Document: Done (" + p.body.length + " bytes, " + p.chain + ")", p.title || p.name);
    } else if (p.url) {
      show('<iframe sandbox="allow-scripts allow-pointer-lock" src="' + esc(p.url) + '" title="' + esc(p.name) + '"></iframe>', "Document: Done (" + p.chain + ", sandboxed)", p.title || p.name);
    } else {
      show(meshtext("# Not found\n" + (p.detail || "") + "\n\n=> " + home() + " Go home"), "Document: not found", "Not found");
    }
  }).catch(function () { show(meshtext("# Not found\nThis arcade did not answer.\n\n=> directory The directory"), "Document: not found", "Not found"); });
}
$("view").onclick = function (e) { var a = e.target.closest("a[data-to]"); if (a) go(a.dataset.to); };
$("go").onclick = function () { go($("addr").value); };
$("addr").onkeydown = function (e) { if (e.key === "Enter") go($("addr").value); };
$("back").onclick = function () { if (back.length) { fwd.push(at); go(back.pop(), "back"); } };
$("fwd").onclick = function () { if (fwd.length) { back.push(at); go(fwd.pop(), "fwd"); } };
$("reload").onclick = function () { if (at) go(at, "reload"); };
$("home").onclick = function () { go(home()); };
var makeHome = function (e) { if (e) e.preventDefault(); store("browserhome", at); $("status").textContent = at + " is your homepage."; };
$("home").oncontextmenu = makeHome;
var held; $("home").onpointerdown = function () { held = setTimeout(makeHome, 700); };
$("home").onpointerup = $("home").onpointerleave = function () { clearTimeout(held); };
var start = atBrowser ? decodeURIComponent(location.pathname.replace(/^\/browser\/?/, "")) : "";
go(start || home(), "start");
</script>
</body>
</html>
